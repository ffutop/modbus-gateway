<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModMux 令牌调配台</title>
<!-- The studio's own chrome uses the saved tokens; only the preview shows the draft. -->
<link rel="stylesheet" href="/repo/web/tokens.css" id="saved-tokens">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:var(--fs-body)/1.45 var(--font-ui);color:var(--body);background:var(--canvas);display:flex;flex-direction:column;min-width:1100px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:var(--fs-small)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;height:calc(26px * var(--k));padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--hair);background:var(--canvas);font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer}
.btn:hover:not(:disabled){background:var(--soft)} .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-dark)} .btn.pri:hover:not(:disabled){background:var(--body)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{width:calc(26px * var(--k));padding:0;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:500;background:var(--card);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.err{background:var(--err-bg);color:var(--err)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

header{height:calc(44px * var(--k));flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hair)}
header h1{font-size:var(--fs-body);font-weight:600;color:var(--ink);margin-right:4px}
header .path{font-family:var(--mono);font-size:var(--fs-caption);color:var(--muted)}
header .sp{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(400px,34vw,520px) minmax(0,1fr)}

.panel{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:var(--canvas)}
.tabs{display:flex;gap:16px;padding:0 14px;border-bottom:1px solid var(--hair);flex:none}
.tabs button{background:none;border:0;height:calc(34px * var(--k));color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 0 24px}
.group{padding:10px 14px 2px;font-size:var(--fs-caption);font-weight:600;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.group .sp{flex:1}
.note{margin:10px 14px;padding:8px 10px;border-radius:var(--r-sm);background:var(--soft);font-size:var(--fs-caption);color:var(--muted)}

.sw{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid rgba(0,0,0,.12);flex:none;cursor:pointer;padding:0}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 14px}
.crow:hover{background:var(--soft)}
.crow.flash{animation:flash 1.2s}
@keyframes flash{from{background:var(--highlight)}to{background:transparent}}
.crow .sw{grid-row:span 2}
.cname{font-family:var(--mono);font-size:var(--fs-small);color:var(--ink);font-weight:600}
.cref{font-family:var(--mono);font-size:var(--fs-caption);color:var(--muted);text-align:right;white-space:nowrap}
.cuse{grid-column:2 / 4;font-size:var(--fs-caption);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--mono);font-size:var(--fs-micro);padding:0 6px;border-radius:var(--r-pill);background:var(--ok-bg);color:var(--ok)}
.chip.fail{background:var(--err-bg);color:var(--err)}

.pop{position:fixed;z-index:10;background:var(--canvas);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:10px;width:480px;max-height:60vh;overflow:auto}
.pop .fam{display:flex;align-items:flex-start;gap:4px;margin-bottom:4px}
.pop .fam .sws{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.pop .fam span{width:56px;flex:none;line-height:24px;font-family:var(--mono);font-size:var(--fs-micro);color:var(--muted)}
.pop .sw{width:24px;height:24px}
.pop .sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
.pop .foot{border-top:1px solid var(--hair);margin-top:8px;padding-top:8px;display:flex;gap:6px}

.prow{display:grid;grid-template-columns:28px 92px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:5px 14px}
.prow:hover{background:var(--soft)}
.prow input[type=color]{width:28px;height:28px;border:1px solid var(--hair);border-radius:var(--r-sm);padding:0;background:none;cursor:pointer}
.prow input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.prow input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.prow .refs{grid-column:2 / 5;font-size:var(--fs-caption);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .refs.none{color:var(--warn)}
input.t{height:calc(26px * var(--k));border:1px solid var(--hair);border-radius:var(--r-sm);padding:0 7px;background:var(--canvas);min-width:0;width:100%}
input.t:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
input.t[aria-invalid=true]{border-color:var(--err-solid);background:var(--err-tint)}
input.num{width:72px;text-align:right;font-family:var(--mono)}

.drow{display:grid;grid-template-columns:64px 72px minmax(0,1fr) 112px;gap:10px;align-items:center;padding:6px 14px}
.drow:hover{background:var(--soft)}
.drow .derived{font-family:var(--mono);font-size:var(--fs-caption);color:var(--muted);text-align:right;white-space:nowrap}
.drow .sample{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .rbox{width:56px;height:28px;background:var(--card);border:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:92px minmax(0,1fr) 40px;gap:10px;align-items:center;padding:6px 14px}
.vrow .demo{width:40px;height:28px;border-radius:var(--r-sm);background:var(--canvas);border:1px solid var(--hair)}
.checker{background:repeating-conic-gradient(var(--card) 0 25%,var(--canvas) 0 50%) 0 0/10px 10px}

.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--backdrop)}
.stage iframe{flex:1;min-height:0;border:0;width:100%;background:var(--backdrop)}
.rules{flex:none;border-top:1px solid var(--hair);background:var(--canvas);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:30vh;overflow:auto}
.rules .lbl{font-size:var(--fs-caption);font-weight:600;color:var(--muted);margin-right:4px}
.rule{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:var(--r-pill);padding:1px 8px 1px 2px;background:var(--canvas);cursor:pointer;font-family:var(--mono);font-size:var(--fs-micro);color:var(--body)}
.rule:hover{border-color:var(--line-strong)}
.rule i{font-style:normal;padding:0 6px;border-radius:var(--r-pill);font-weight:600}
.rule .pair{display:inline-flex;align-items:center;justify-content:center;width:26px;height:16px;border-radius:var(--r-pill);font-weight:700;font-family:var(--font-ui)}
.rule.pass i{background:var(--ok-bg);color:var(--ok)} .rule.fail{border-color:var(--err-solid)} .rule.fail i{background:var(--err-bg);color:var(--err)}

.banner{margin:8px 14px 0;padding:8px 10px;border-radius:var(--r-sm);font-size:var(--fs-caption)}
.banner.err{background:var(--err-bg);color:var(--err)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner ul{margin:4px 0 0 16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:var(--on-dark-body);padding:8px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);font-size:var(--fs-caption);opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>令牌调配台</h1>
  <span class="path">design/tokens.json</span>
  <span id="state"></span>
  <span class="sp"></span>
  <span id="summary"></span>
  <button class="btn icon" id="undo" title="撤销 (Ctrl+Z)" aria-label="撤销"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3 2.5 6.5 6 10"/><path d="M2.5 6.5H10a3.5 3.5 0 0 1 0 7H8"/></svg></button>
  <button class="btn icon" id="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l3.5 3.5L10 10"/><path d="M13.5 6.5H6a3.5 3.5 0 0 0 0 7h2"/></svg></button>
  <button class="btn" id="revert">放弃修改</button>
  <button class="btn pri" id="save" title="写入 tokens.json 并重新生成令牌文件 (Ctrl+S)">保存并生成</button>
</header>
<main>
  <section class="panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="color" aria-selected="true">语义颜色</button>
      <button role="tab" data-tab="palette">色板</button>
      <button role="tab" data-tab="size">字号与圆角</button>
      <button role="tab" data-tab="other">字体与效果</button>
    </nav>
    <div id="problems"></div>
    <div class="scroll" id="panel"></div>
  </section>
  <section class="stage">
    <iframe id="preview" src="/preview" title="组件预览"></iframe>
    <div class="rules" id="rules" aria-label="对比度规则"></div>
  </section>
</main>
<div class="pop" id="pop" hidden></div>
<div id="toast" role="status"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NAME = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/;
const HEX = /^#[0-9a-f]{6}$/;

// Semantic colors grouped as in design/README.md; names not listed land in 其他.
const GROUPS = [
  ['文本', ['ink', 'body', 'muted', 'faint']],
  ['表面', ['canvas', 'soft', 'card', 'hover', 'backdrop']],
  ['分隔', ['hair', 'hair-soft', 'line', 'line-strong']],
  ['深色区', ['dark', 'on-dark', 'on-dark-body', 'on-dark-muted']],
  ['状态 · 健康', ['ok', 'ok-bg', 'ok-solid']],
  ['状态 · 降级', ['warn', 'warn-bg', 'warn-solid']],
  ['状态 · 故障', ['err', 'err-bg', 'err-tint', 'err-solid']],
  ['强调与变化', ['accent', 'accent-bg', 'accent-md', 'highlight']],
];

let tok = null;         // the draft
let saved = '';         // JSON of the last loaded or saved version
let rules = [];
let tab = 'color';
const undo = [], redo = [];
let lastKey = '', lastAt = 0;

// ---- model helpers ----
const pal = (name) => tok.palette.find((p) => p.name === name);
// Invalid hex mid-edit renders as black rather than breaking contrast math.
const hexOf = (color) => { const c = tok.color.find((x) => x.name === color); const p = c && pal(c.ref); return p && HEX.test(p.value) ? p.value : '#000000'; };
const refsTo = (name) => tok.color.filter((c) => c.ref === name).map((c) => c.name);
const family = (name) => { const m = name.match(/^(.*)-\d+$/); return m ? m[1] : name; };
const num = (f) => String(+f.toFixed(4));

function luminance(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrast(a, b) { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
const ruleResults = () => rules.map((r) => ({ ...r, ratio: contrast(hexOf(r.fg), hexOf(r.bg)) }));

// Mirrors design.(*Tokens).css so the preview matches the generated file.
function css() {
  const l = [`--k:${num(tok.density.web)};`];
  for (const c of tok.color) l.push(`--${c.name}:${hexOf(c.name)};`);
  for (const v of [...tok.alpha, ...tok.shadow, ...tok.font]) l.push(`--${v.name}:${v.value};`);
  for (const d of tok.fontSize) l.push(`--fs-${d.name}:calc(${num(d.value)}px * var(--k));`);
  for (const d of tok.radius) l.push(`--r-${d.name}:${num(d.value)}px;`);
  return `:root{${l.join('')}}`;
}

function problems() {
  const out = [], seen = new Set();
  for (const p of tok.palette) {
    if (!NAME.test(p.name)) out.push(`色板名称“${p.name}”须为小写 kebab-case`);
    if (seen.has(p.name)) out.push(`色板名称“${p.name}”重复`);
    seen.add(p.name);
    if (!HEX.test(p.value)) out.push(`色板 ${p.name} 的值“${p.value}”须为小写 #rrggbb`);
    if (!refsTo(p.name).length) out.push(`色板 ${p.name} 未被任何语义颜色引用：删除它，或在“语义颜色”中引用`);
  }
  for (const d of [...tok.fontSize, ...tok.radius]) if (!(d.value > 0)) out.push(`${d.name} 的值须为正数`);
  if (!(tok.density.web > 0) || !(tok.density['desktop-native'] > 0)) out.push('缩放系数须为正数');
  return out;
}

// ---- history ----
const snapshot = () => JSON.stringify(tok);
// mutate records an undo step (coalescing rapid edits of the same field) and refreshes.
function mutate(key, fn, structural) {
  const now = Date.now();
  if (key !== lastKey || now - lastAt > 1200) { undo.push(snapshot()); redo.length = 0; if (undo.length > 200) undo.shift(); }
  lastKey = key; lastAt = now;
  fn();
  structural ? render() : refresh();
}
function step(from, to) {
  if (!from.length) return;
  to.push(snapshot()); tok = JSON.parse(from.pop()); lastKey = ''; render();
}

// ---- rendering ----
function render() {
  document.querySelectorAll('.tabs [role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const focus = document.activeElement?.dataset?.k;
  const top = $('#panel').scrollTop;
  $('#panel').innerHTML = { color: colorPanel, palette: palettePanel, size: sizePanel, other: otherPanel }[tab]();
  $('#panel').scrollTop = top;
  if (focus) $(`#panel [data-k="${CSS.escape(focus)}"]`)?.focus();
  refresh();
}

// refresh updates everything derived from the draft without rebuilding inputs.
function refresh() {
  const res = ruleResults();
  const fails = res.filter((r) => r.ratio < r.min);
  $('#rules').innerHTML = `<span class="lbl">对比度</span>` + res.map((r) =>
    `<button class="rule ${r.ratio < r.min ? 'fail' : 'pass'}" data-jump="${esc(r.fg)}" title="${esc(r.fg)} 位于 ${esc(r.bg)} 之上，要求 ≥ ${r.min}">
      <span class="pair" style="color:${hexOf(r.fg)};background:${hexOf(r.bg)}">Aa</span>${esc(r.fg)} / ${esc(r.bg)} <i>${r.ratio.toFixed(2)}</i></button>`).join('');
  $('#summary').innerHTML = fails.length ? `<span class="badge err">${fails.length} 项对比度未达标</span>` : `<span class="badge ok">对比度 ${res.length}/${res.length} 达标</span>`;

  const probs = problems();
  const orphans = tok.palette.filter((p) => !refsTo(p.name).length);
  $('#problems').innerHTML = probs.length ? `<div class="banner warn"><b>修正以下问题后才能保存</b><ul>${probs.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>${orphans.length ? `<button class="btn" id="prune" style="margin-top:6px">删除 ${orphans.length} 个未引用的色板颜色</button>` : ''}</div>` : '';
  const dirty = snapshot() !== saved;
  $('#state').innerHTML = dirty ? '<span class="badge warn">未保存</span>' : '<span class="badge">已与文件一致</span>';
  $('#save').disabled = !dirty || probs.length > 0;
  $('#revert').disabled = !dirty;
  $('#undo').disabled = !undo.length;
  $('#redo').disabled = !redo.length;

  // Swatches and readouts inside the current panel.
  document.querySelectorAll('[data-swatch]').forEach((el) => { el.style.background = hexOf(el.dataset.swatch); });
  document.querySelectorAll('[data-refline]').forEach((el) => { const c = tok.color.find((x) => x.name === el.dataset.refline); el.textContent = `${c.ref} · ${hexOf(c.name)}`; });
  document.querySelectorAll('[data-chips]').forEach((el) => {
    el.innerHTML = res.filter((r) => r.fg === el.dataset.chips).map((r) => `<span class="chip ${r.ratio < r.min ? 'fail' : ''}" title="要求 ≥ ${r.min}">${esc(r.bg)} ${r.ratio.toFixed(2)}</span>`).join('');
  });
  document.querySelectorAll('[data-derived]').forEach((el) => {
    const d = tok.fontSize.find((x) => x.name === el.dataset.derived);
    el.textContent = `${num(d.value * tok.density.web)}px · ${num(Math.round(d.value * tok.density['desktop-native'] * 2) / 2)}sp`;
  });
  document.querySelectorAll('[data-sample]').forEach((el) => { const d = tok.fontSize.find((x) => x.name === el.dataset.sample); el.style.fontSize = `${d.value * tok.density.web}px`; });
  document.querySelectorAll('[data-rbox]').forEach((el) => { const d = tok.radius.find((x) => x.name === el.dataset.rbox); el.style.borderRadius = `${Math.min(d.value, 14)}px`; });
  document.querySelectorAll('input[data-k^="palette."][data-field=value]').forEach((el) => el.setAttribute('aria-invalid', String(!HEX.test(el.value))));

  const frame = $('#preview').contentWindow;
  if (frame && frame.apply) frame.apply(css(), tok);
}

function colorPanel() {
  const listed = new Set(GROUPS.flatMap((g) => g[1]));
  const groups = [...GROUPS, ['其他', tok.color.map((c) => c.name).filter((n) => !listed.has(n))]];
  return `<p class="note">点击色块从色板中选色。语义颜色的名称会被代码引用，只能在 tokens.json 中增删。</p>` + groups.map(([title, names]) => {
    const rows = names.map((n) => tok.color.find((c) => c.name === n)).filter(Boolean);
    if (!rows.length) return '';
    return `<div class="group">${esc(title)}</div>` + rows.map((c) => `
      <div class="crow" id="c-${esc(c.name)}">
        <button class="sw" data-pick="${esc(c.name)}" data-swatch="${esc(c.name)}" aria-label="为 ${esc(c.name)} 选择色板颜色"></button>
        <span class="cname">${esc(c.name)}</span>
        <span class="cref" data-refline="${esc(c.name)}"></span>
        <span class="cuse">${esc(c.use || '')}<span data-chips="${esc(c.name)}" style="display:contents"></span></span>
      </div>`).join('');
  }).join('');
}

function palettePanel() {
  const fams = [];
  tok.palette.forEach((p, i) => { const f = family(p.name); let g = fams.find((x) => x[0] === f); if (!g) fams.push(g = [f, []]); g[1].push(i); });
  return `<p class="note">修改色板会影响所有引用它的语义颜色。未被引用的色板颜色无法保存，请删除或在“语义颜色”中引用。</p>` +
    fams.map(([f, idx]) => `<div class="group">${esc(f)}</div>` + idx.map((i) => {
      const p = tok.palette[i], refs = refsTo(p.name);
      return `<div class="prow">
        <input type="color" value="${HEX.test(p.value) ? p.value : '#000000'}" data-k="palette.${i}.value" data-field="value" aria-label="${esc(p.name)} 颜色">
        <input class="t mono" value="${esc(p.name)}" data-k="palette.${i}.name" data-field="name" aria-label="名称" aria-invalid="${!NAME.test(p.name)}">
        <input class="t mono" value="${esc(p.value)}" data-k="palette.${i}.value" data-field="value" aria-label="${esc(p.name)} 色值">
        <button class="btn icon" data-del="${i}" ${refs.length ? `disabled title="仍被 ${esc(refs.join('、'))} 引用"` : 'title="删除"'} aria-label="删除 ${esc(p.name)}">×</button>
        <span class="refs ${refs.length ? '' : 'none'}">${refs.length ? '被 ' + esc(refs.join('、')) + ' 引用' : '未被引用'}</span>
      </div>`;
    }).join('')).join('') +
    `<div class="group"><span class="sp"></span><button class="btn" id="add-pal">＋ 添加色板颜色</button></div>`;
}

function sizePanel() {
  const t = tok;
  return `<div class="group">缩放系数（渲染尺寸 = 设计尺寸 × 系数）</div>
    <div class="drow"><span class="mono">web</span><input class="t num" type="number" step="0.01" min="0.5" value="${t.density.web}" data-k="density.web"><span class="muted">浏览器控制台、停机页（--k）</span><span></span></div>
    <div class="drow"><span class="mono">desktop</span><input class="t num" type="number" step="0.01" min="0.5" value="${t.density['desktop-native']}" data-k="density.desktop-native"><span class="muted">Gio 原生桌面版，四舍五入到 0.5sp</span><span></span></div>
    <div class="group">字号（设计尺寸）<span class="sp"></span><span class="faint">web · desktop</span></div>` +
    t.fontSize.map((d, i) => `<div class="drow"><span class="mono">${esc(d.name)}</span><input class="t num" type="number" step="0.5" min="6" value="${d.value}" data-k="fontSize.${i}.value"><span class="sample" data-sample="${esc(d.name)}" title="${esc(d.use || '')}">${esc(d.use || 'Modbus 网关')}</span><span class="derived" data-derived="${esc(d.name)}"></span></div>`).join('') +
    `<div class="group">圆角（px）</div>` +
    t.radius.map((d, i) => `<div class="drow"><span class="mono">${esc(d.name)}</span><input class="t num" type="number" step="1" min="1" value="${d.value}" data-k="radius.${i}.value"><span class="muted">${esc(d.use || '')}</span><span class="rbox" data-rbox="${esc(d.name)}"></span></div>`).join('');
}

function otherPanel() {
  const row = (group, d, i, demo) => `<div class="vrow"><span class="mono">${esc(d.name)}</span><input class="t mono" value="${esc(d.value)}" data-k="${group}.${i}.value" aria-label="${esc(d.name)}" title="${esc(d.use || '')}">${demo}</div>`;
  return `<div class="group">字体栈</div>` + tok.font.map((d, i) => row('font', d, i, `<span style="font-family:${esc(d.value)}">Aa 0x</span>`)).join('') +
    `<div class="group">遮罩</div>` + tok.alpha.map((d, i) => row('alpha', d, i, `<span class="demo checker"><span style="display:block;height:100%;border-radius:inherit;background:${esc(d.value)}"></span></span>`)).join('') +
    `<div class="group">阴影</div>` + tok.shadow.map((d, i) => row('shadow', d, i, `<span class="demo" style="box-shadow:${esc(d.value)}"></span>`)).join('') +
    `<p class="note">这些值原样写入 CSS，请使用合法的 CSS 值；字体与效果在预览中实时生效。</p>`;
}

// ---- palette picker ----
function openPicker(btn) {
  const color = tok.color.find((c) => c.name === btn.dataset.pick);
  const fams = [];
  tok.palette.forEach((p) => { const f = family(p.name); let g = fams.find((x) => x[0] === f); if (!g) fams.push(g = [f, []]); g[1].push(p); });
  const pop = $('#pop');
  pop.innerHTML = fams.map(([f, ps]) => `<div class="fam"><span>${esc(f)}</span><div class="sws">${ps.map((p) =>
    `<button class="sw" style="background:${HEX.test(p.value) ? p.value : '#000'}" data-choose="${esc(p.name)}" aria-pressed="${p.name === color.ref}" title="${esc(p.name)} ${esc(p.value)}" aria-label="${esc(p.name)}"></button>`).join('')}</div></div>`).join('') +
    // A palette color used by this role alone can be edited in place; a shared one is forked first.
    `<div class="foot">${refsTo(color.ref).length > 1
      ? `<button class="btn" data-fork>＋ 复制为独立色板颜色（${esc(color.ref)} 还被 ${refsTo(color.ref).length - 1} 个令牌使用）</button>`
      : `<button class="btn" data-edit>在色板中调整 ${esc(color.ref)}</button>`}</div>`;
  pop.dataset.color = color.name;
  pop.hidden = false;
  const r = btn.getBoundingClientRect();
  pop.style.left = `${Math.min(r.left, innerWidth - 360)}px`;
  pop.style.top = `${Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 8)}px`;
  pop.querySelector('[aria-pressed=true]')?.focus();
}
function closePicker() { $('#pop').hidden = true; }
function focusPalette(i) {
  tab = 'palette'; render();
  const el = $(`#panel input.t[data-k="palette.${i}.value"]`);
  if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); el.select(); }
}

$('#pop').addEventListener('click', (e) => {
  const name = $('#pop').dataset.color;
  const c = tok.color.find((x) => x.name === name);
  const choose = e.target.closest('[data-choose]');
  if (choose) { mutate('ref:' + name, () => { c.ref = choose.dataset.choose; }, true); closePicker(); return; }
  if (e.target.closest('[data-edit]')) { closePicker(); focusPalette(tok.palette.findIndex((p) => p.name === c.ref)); return; }
  if (e.target.closest('[data-fork]')) {
    // A dedicated palette entry lets this one role be tuned without touching others.
    let n = `${name}-custom`, i = 2;
    while (pal(n)) n = `${name}-custom-${i++}`;
    mutate('fork:' + name, () => { tok.palette.push({ name: n, value: hexOf(name) }); c.ref = n; }, true);
    closePicker(); focusPalette(tok.palette.length - 1);
  }
});
document.addEventListener('mousedown', (e) => { if (!$('#pop').hidden && !e.target.closest('#pop,[data-pick]')) closePicker(); });

// ---- events ----
$('.tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; closePicker(); render(); } });
$('#rules').addEventListener('click', (e) => {
  const b = e.target.closest('[data-jump]'); if (!b) return;
  tab = 'color'; render();
  const row = document.getElementById('c-' + b.dataset.jump);
  if (row) { row.scrollIntoView({ block: 'center' }); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
});
$('#panel').addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]'); if (pick) { $('#pop').hidden || $('#pop').dataset.color !== pick.dataset.pick ? openPicker(pick) : closePicker(); return; }
  const del = e.target.closest('[data-del]'); if (del) { mutate('del', () => tok.palette.splice(+del.dataset.del, 1), true); return; }
  if (e.target.closest('#add-pal')) {
    let n = 'new-1', i = 2; while (pal(n)) n = `new-${i++}`;
    mutate('add', () => tok.palette.push({ name: n, value: '#888888' }), true);
    $(`#panel [data-k="palette.${tok.palette.length - 1}.name"]`)?.select();
  }
});

function setPath(path, raw, type) {
  const keys = path.split('.');
  let o = tok;
  for (const k of keys.slice(0, -1)) o = o[k];
  const last = keys[keys.length - 1];
  o[last] = type === 'number' ? parseFloat(raw) : raw;
}
$('#panel').addEventListener('input', (e) => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  if (k.startsWith('palette.') && el.dataset.field === 'name') {
    // Renaming a palette entry carries its references along.
    const p = tok.palette[+k.split('.')[1]], old = p.name, next = el.value.trim();
    mutate(k, () => { tok.color.forEach((c) => { if (c.ref === old) c.ref = next; }); p.name = next; });
    el.setAttribute('aria-invalid', String(!NAME.test(next)));
    return;
  }
  let v = el.value;
  if (k.startsWith('palette.')) {
    v = v.trim().toLowerCase();
    if (/^[0-9a-f]{6}$/.test(v)) v = '#' + v;
    // Keep the color input and the hex field in step.
    document.querySelectorAll(`#panel [data-k="${k}"]`).forEach((o) => { if (o !== el && (o.type !== 'color' || HEX.test(v))) o.value = v; });
  }
  if (el.type === 'number' && !(parseFloat(v) > 0)) return; // keep the last valid value while typing
  mutate(k, () => setPath(k, v, el.type));
});
// Rebuild after a committed edit so groupings and reference lists catch up.
$('#panel').addEventListener('change', (e) => { if (e.target.dataset.k?.startsWith('palette.')) render(); });

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') closePicker();
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); if (!$('#save').disabled) save(); }
  if (mod && e.key.toLowerCase() === 'z' && !e.target.matches('input.t')) { e.preventDefault(); e.shiftKey ? step(redo, undo) : step(undo, redo); }
});
$('#undo').onclick = () => step(undo, redo);
$('#redo').onclick = () => step(redo, undo);
$('#revert').onclick = () => { if (confirm('放弃所有未保存的修改？')) { undo.push(snapshot()); tok = JSON.parse(saved); render(); } };
$('#save').onclick = save;
$('#problems').addEventListener('click', (e) => {
  if (e.target.closest('#prune')) mutate('prune', () => { tok.palette = tok.palette.filter((p) => refsTo(p.name).length); }, true);
});
$('#preview').addEventListener('load', () => tok && refresh());
addEventListener('beforeunload', (e) => { if (tok && snapshot() !== saved) { e.preventDefault(); e.returnValue = ''; } });

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }

async function save() {
  const fails = ruleResults().filter((r) => r.ratio < r.min);
  if (fails.length && !confirm(`${fails.length} 项对比度未达标，保存后 go test ./design 会失败。仍然保存？`)) return;
  $('#save').disabled = true;
  try {
    const res = await fetch('/api/tokens', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: snapshot() });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    saved = snapshot();
    // Pick up the regenerated tokens.css in the studio chrome.
    $('#saved-tokens').href = `/repo/web/tokens.css?v=${Date.now()}`;
    toast(`已写入 ${body.wrote.length} 个文件：${body.wrote.join('、')}`);
  } catch (err) {
    $('#problems').innerHTML = `<div class="banner err"><b>保存失败</b>：${esc(err.message)}</div>`;
    return;
  } finally { refresh(); }
}

(async function load() {
  try {
    const res = await fetch('/api/tokens');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    tok = body.tokens; rules = body.rules; saved = snapshot();
    render();
  } catch (err) {
    $('#panel').innerHTML = `<div class="banner err">无法读取 tokens.json：${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
