name: Release Go Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and publish (e.g. v0.5.0)'
        required: true
        type: string

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define the build matrix for GOOS and GOARCH
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        # Exclude unsupported combinations (if any)
        # exclude:
        #   - goos: darwin
        #     goarch: arm
    outputs:
      matrix: ${{ toJSON(matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set output executable name and archive name
        id: set_names
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXECUTABLE_NAME="modbus-gateway.exe"
            ARCHIVE_EXT="zip"
          else
            EXECUTABLE_NAME="modbus-gateway"
            ARCHIVE_EXT="tar.gz"
          fi
          
          # set archive name
          ARCHIVE_NAME="modbus-gateway-${{ matrix.goos }}-${{ matrix.goarch }}."
          
          # set environment variables for GitHub Actions
          echo "EXECUTABLE_NAME=${EXECUTABLE_NAME}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "ARCHIVE_EXT=${ARCHIVE_EXT}" >> $GITHUB_ENV

      - name: Build
        env:
          # set environment variables for cross-compilation
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o ${{ env.EXECUTABLE_NAME }} .

      - name: Package artifacts
        run: |
          # create a temporary directory for packaging
          mkdir -p release_package
          mv ${{ env.EXECUTABLE_NAME }} release_package/
          cp LICENSE release_package/
          
          # package artifacts based on the operating system type
          cd release_package
          if [ "${{ env.ARCHIVE_EXT }}" = "zip" ]; then
            zip ../${{ env.ARCHIVE_NAME }}${{ env.ARCHIVE_EXT }} *
          else
            tar -czf ../${{ env.ARCHIVE_NAME }}${{ env.ARCHIVE_EXT }} *
          fi
          cd ..

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}${{ env.ARCHIVE_EXT }}
          path: ${{ env.ARCHIVE_NAME }}${{ env.ARCHIVE_EXT }}

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ffutop/modbus-gateway
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag || github.ref_name }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/workflows/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: [build-binaries, build-and-push-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # Restore the remote tag object if checkout fetched a peeled commit ref.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          ref = f"refs/tags/{tag}"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          notes = ""
          if git("cat-file", "-t", ref).strip() == "tag":
              notes = git("for-each-ref", "--format=%(contents)", ref).strip()
          if not notes:
              version = tag.removeprefix("v")
              sections = []
              for filename, language in [("CHANGELOG.md", "English"),
                                         ("CHANGELOG_CN.md", "中文")]:
                  result = subprocess.run(["git", "show", f"{ref}:{filename}"],
                                          capture_output=True, text=True)
                  if result.returncode != 0:
                      continue
                  pattern = (r"^## \[" + re.escape(version)
                             + r"\][^\n]*\n(.*?)(?=^## |\Z)")
                  match = re.search(pattern, result.stdout, re.MULTILINE | re.DOTALL)
                  if match:
                      body = re.split(r"^\[[^\]]+\]:", match[1],
                                      maxsplit=1, flags=re.MULTILINE)[0].strip()
                      if body:
                          sections.append(f"## {language}\n\n{body}")
              notes = "\n\n".join(sections)
          if not notes:
              raise SystemExit(f"No annotation or matching changelog section for {tag}")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PYTHON

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*/*
