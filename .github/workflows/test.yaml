name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go vet and unit tests (Go 1.21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      # Not -race yet: transport/rtu's tests have a known pre-existing data race.
      - run: go test ./...

