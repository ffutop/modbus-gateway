name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go vet and unit tests (Go 1.21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      # Not -race yet: internal/transport/rtu's tests have a known pre-existing data race.
      - run: go test ./...


  desktop:
    name: Desktop app vet and tests (Go 1.24)
    # Gio needs no extra packages on macOS; Linux would need CGO and the
    # X11/Wayland/EGL development headers.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: desktop-native/go.sum
      - run: go vet ./...
      - run: go test ./...
      # Windows needs no CGO: a cross build catches platform-specific breakage.
      - run: GOOS=windows go build -o /dev/null .
