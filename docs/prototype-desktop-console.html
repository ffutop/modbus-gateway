  Question: v0.6.0 管理控制台做成「桌面端应用」时，一屏（无页面滚动、无翻页）应该长什么样？
  Verdict (2026-10-03):
    - 主体采用「IDE 工作台」布局：树 + 编辑区 + 检查器 + 底部停靠面板 + 状态栏。
    - 「拓扑画布」作为编辑区的补充视图保留：固定标签页「拓扑」，宽屏下与详情并排常驻，
      节点点击与左侧树联动选中。
    - 「导航栏 + 固定磁贴」方案落选。
  Verdict (window, 2026-10-03): 窗口适配策略已确认 —— 最小 1280×720，更大窗口分档自适应：
      紧凑  1280–1599  : 侧栏 220 / 检查器 260
      标准  1600–1919  : 侧栏 248 / 检查器 300
      宽屏  1920–2559  : 编辑区拆分为「详情 | 拓扑」并排
      超宽  ≥2560      : 请求日志从底部面板移到右侧整列，编辑区获得全高
      高度              : 底部面板 clamp(180px, 32vh, 420px)；高度 ≥1000 时检查器追加「最近错误」
    分隔条可拖动（双击复位）；列表按可用高度"装多少显示多少"；树放不下时自动折叠未选中网关。
  Verdict (font size, 2026-10-03): 正文 14px（Windows 11 正文字号）。原 12.5px 偏小。
    所有字号、行高、控件高度都按 --k = 14 / 12.5 等比放大；侧栏和检查器宽度按放大幅度的 60% 加宽。
    对比过 12.5 / 13 / 14 / 15 / 16 五档：16px 在 1280×720 下过于拥挤，可作为日后「设置」里的可选项。
  Run:      open docs/prototype-desktop-console.html   （拖动浏览器窗口大小观察分档）
-->

<div id="tiny"><b>窗口尺寸低于最小要求 1280 × 720</b><span id="tiny-now"></span><span>桌面壳中会通过 MinWidth / MinHeight 直接禁止缩到这个尺寸以下</span></div>

<script>
/* ===================== mock data (v1 schema shape) ===================== */
const CFG = {
  simulations: [
    { name: 'line-a', persistence: { type: 'mmap', path: '/data/line-a.bin' } },
    { name: 'boiler', persistence: { type: 'memory', path: '' } },
  ],
  gateways: [
    { name: 'modbus-slave',
      upstreams: [ { type: 'tcp', addr: '0.0.0.0:33502' }, { type: 'rtu-over-tcp', addr: '0.0.0.0:502' } ],
      downstreams: [
        { name: 'plc-sim', type: 'local', slave_ids: '100', sim: 'line-a' },
        { name: 'scada-inject', type: 'injector', slave_ids: '200', sim: 'line-a',
          mappings: [ { src: 'holding_registers', start: 0, count: 32, dst: 'input_registers', dstStart: 0 },
                      { src: 'coils', start: 0, count: 16, dst: 'discrete_inputs', dstStart: 100 } ] },
        { name: 'boiler-sim', type: 'local', slave_ids: '101', sim: 'boiler' },
      ] },
    { name: 'tcp-bridge', upstreams: [ { type: 'tcp', addr: '0.0.0.0:503' } ],
      downstreams: [ { name: 'remote-plc', type: 'tcp', slave_ids: '1-10', addr: '192.168.1.100:502' } ] },
    { name: 'rtu-bus', upstreams: [ { type: 'tcp', addr: '0.0.0.0:504' } ],
      downstreams: [ { name: 'rs485-1', type: 'rtu', slave_ids: '1-32', serial: '/dev/ttyUSB0 · 9600 8N1' } ] },
  ],
};
const SIM_STATE = { 'line-a': { status: 'ready', version: 18234 }, 'boiler': { status: 'degraded', version: 512 } };
const FC = { 1: '读线圈', 3: '读保持', 4: '读输入', 5: '写单线圈', 6: '写单寄存器', 16: '写多寄存器' };
const SRCS = ['10.0.8.21:51022', '10.0.8.21:51023', '10.0.8.40:60110', '127.0.0.1:49210'];
const TABLES = [['holding_registers','保持寄存器 4x'],['input_registers','输入寄存器 3x'],['coils','线圈 0x'],['discrete_inputs','离散输入 1x']];

const regs = {}, hot = new Map();
function regTab(sim, table) {
  regs[sim] ??= {};
  if (!regs[sim][table]) {
    const a = new Uint16Array(65536), bit = table === 'coils' || table === 'discrete_inputs';
    for (let i = 0; i < 400; i++) a[i] = bit ? (Math.random() < .3 ? 1 : 0) : (Math.random() < .25 ? 0 : (Math.random() * 3000) | 0);
    regs[sim][table] = a;
  }
  return regs[sim][table];
}
const M = {};
const m = key => M[key] ??= { req: 0, err: 0, rps: 0, lat: [], hist: Array(40).fill(0) };
const LOG = [];
let paused = false, booted = false;
function genOne() {
  const gw = CFG.gateways[(Math.random() * CFG.gateways.length * 1.6 | 0) % CFG.gateways.length];
  const d = gw.downstreams[Math.random() * gw.downstreams.length | 0];
  const slave = d.slave_ids.includes('-') ? Number(d.slave_ids.split('-')[0]) + (Math.random() * 4 | 0) : Number(d.slave_ids);
  const fcs = d.type === 'injector' ? [6, 16, 5] : [3, 3, 3, 4, 1, 6];
  const fc = fcs[Math.random() * fcs.length | 0];
  const ms = d.type === 'tcp' || d.type === 'rtu' ? 4 + Math.random() * (d.type === 'rtu' ? 60 : 18) : 0.05 + Math.random() * .3;
  let ok = Math.random() > (d.type === 'rtu' ? .06 : d.type === 'tcp' ? .02 : .003);
  let err = ok ? '' : (d.type === 'rtu' ? '超时 (Gateway Target No Response)' : '非法地址 (Illegal Data Address)');
  if (Math.random() < .004) { ok = false; err = '无路由 (Gateway Path Unavailable)'; }
  const addr = Math.random() * 64 | 0, qty = fc === 6 || fc === 5 ? 1 : 1 + (Math.random() * 16 | 0);
  if (ok && d.sim && (fc === 6 || fc === 16 || fc === 5)) {
    let tbl = fc === 5 ? 'coils' : 'holding_registers';
    if (d.type === 'injector') { const mp = d.mappings.find(x => x.src === tbl); if (mp) tbl = mp.dst; }
    const t = regTab(d.sim, tbl), base = d.type === 'injector' && tbl === 'discrete_inputs' ? 100 + (addr % 16) : addr;
    for (let i = 0; i < qty; i++) { t[base + i] = tbl.includes('coil') || tbl.includes('discrete') ? (t[base + i] ^ 1) : (Math.random() * 3000) | 0; hot.set(`${d.sim}/${tbl}/${base + i}`, Date.now()); }
    SIM_STATE[d.sim].version++;
  }
  for (const k of [gw.name, gw.name + '/' + d.name, '*']) { const x = m(k); x.req++; if (!ok) x.err++; x.lat.push(ms); if (x.lat.length > 200) x.lat.shift(); x._n = (x._n || 0) + 1; }
  return { t: new Date(), gw: gw.name, ds: d.name, src: SRCS[Math.random() * SRCS.length | 0], slave, fc, addr, qty, ms, ok, err };
}
function tick() {
  if (!paused) { const n = 6 + (Math.random() * 10 | 0); for (let i = 0; i < n; i++) LOG.unshift(genOne()); LOG.length = Math.min(LOG.length, 600); }
  for (const k in M) { const x = M[k]; x.rps = x._n || 0; x._n = 0; x.hist.push(x.rps); x.hist.shift(); }
  if (booted) live();
}
const pct = (arr, p) => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, (s.length * p) | 0)]; };
const fmtMs = v => v < 1 ? v.toFixed(2) + ' ms' : v.toFixed(1) + ' ms';
const hhmmss = d => d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
const hex = (n, w = 4) => n.toString(16).toUpperCase().padStart(w, '0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const K = 14 / 12.5;   // base font 14px; every size token scales by this
const R = px => Math.round(px * K);
const fit = (el, rowH, reserve = 0) => el ? Math.max(1, Math.floor((el.clientHeight - reserve) / rowH)) : 0;

function spark(hist, h, color = '#111') {
  const w = 240, max = Math.max(1, ...hist);
  const pts = hist.map((v, i) => `${(i / (hist.length - 1) * w).toFixed(1)},${(h - v / max * (h - 2) - 1).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px"><polyline points="0,${h} ${pts} ${w},${h}" fill="${color}" fill-opacity=".07"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

/* log table: columns are dropped by priority when the container is narrow */
const LOG_COLS = { t: ['时间', 108, 1], gw: ['网关', 110, 3], src: ['来源', 130, 4], slave: ['从站', 46, 1], fc: ['功能码', 104, 1], range: ['地址', 80, 2], ds: ['下游', 110, 2], ms: ['耗时', 72, 1], res: ['结果', 150, 1] };
function logRows(el, filter) {
  if (!el) return;
  const n = fit(el, R(24), R(24)), W = el.clientWidth, w = c => R(LOG_COLS[c][1]);
  let cols = Object.keys(LOG_COLS);
  for (const lvl of [4, 3, 2]) if (cols.reduce((s, c) => s + w(c), 0) > W) cols = cols.filter(c => LOG_COLS[c][2] < lvl);
  const C = {
    t: e => `<span class="mono muted">${hhmmss(e.t)}</span>`, gw: e => e.gw, src: e => `<span class="mono">${e.src}</span>`,
    slave: e => `<span class="mono">${e.slave}</span>`, fc: e => `<span class="mono">${hex(e.fc, 2)}</span> ${FC[e.fc]}`,
    range: e => `<span class="mono">${e.addr}${e.qty > 1 ? '+' + e.qty : ''}</span>`, ds: e => e.ds,
    ms: e => `<span class="mono">${fmtMs(e.ms)}</span>`, res: e => e.ok ? '<span class="ok-txt">OK</span>' : `<span class="err-txt">${e.err}</span>`,
  };
  const rows = LOG.filter(filter || (() => true)).slice(0, n);
  el.innerHTML = `<table class="t"><colgroup>${cols.map(c => `<col style="${c === 'res' ? '' : 'width:' + w(c) + 'px'}">`).join('')}</colgroup>
    <tr>${cols.map(c => `<th>${LOG_COLS[c][0]}</th>`).join('')}</tr>
    ${rows.map(e => `<tr${e.ok ? '' : ' style="background:#fffafa"'}>${cols.map(c => `<td>${C[c](e)}</td>`).join('')}</tr>`).join('')}</table>`;
}

function regGrid(el, sim, table, start) {
  if (!el) return 0;
  const bit = table === 'coils' || table === 'discrete_inputs', addrW = R(60), rowH = R(22);
  const fitCols = Math.floor((el.clientWidth - addrW) / R(bit ? 32 : 60));
  const colsN = [32, 16, 10, 8].find(c => c <= fitCols && (bit || c <= 16)) || Math.max(4, fitCols);
  const rows = fit(el, rowH, rowH), t = regTab(sim, table), now = Date.now();
  let h = `<div style="display:grid;grid-template-columns:${addrW}px repeat(${colsN},1fr);grid-auto-rows:${rowH}px"><div class="reg addr"></div>`;
  h += Array.from({ length: colsN }, (_, i) => `<div class="reg addr" style="justify-content:flex-end">+${i}</div>`).join('');
  for (let r = 0; r < rows; r++) {
    const a0 = start + r * colsN; if (a0 > 65535) break;
    h += `<div class="reg addr">${hex(a0)}</div>`;
    for (let c = 0; c < colsN; c++) {
      const a = a0 + c, v = t[a], isHot = now - (hot.get(`${sim}/${table}/${a}`) || 0) < 1500;
      h += `<div class="reg${isHot ? ' hl' : ''}${v ? '' : ' zero'}">${bit ? (v ? '●' : '○') : v}</div>`;
    }
  }
  el.innerHTML = h + '</div>';
  return rows * colsN;
}

/* config draft + validation (mock of POST /api/v1/config/validate) */
const dirty = new Set();
function validateDs(gw, d) {
  const errs = [];
  if (!/^\d+(-\d+)?$/.test(d.slave_ids)) errs.push(`slave_ids "${d.slave_ids}" 格式非法`);
  else for (const o of gw.downstreams) if (o !== d && o.slave_ids === d.slave_ids) errs.push(`Slave ID ${d.slave_ids} 与 ${o.name} 冲突`);
  if (d.type === 'injector' && d.slave_ids.includes('-')) errs.push('injector 只能绑定单个 Slave ID');
  return errs;
}
function allProblems() {
  const p = [];
  for (const g of CFG.gateways) for (const d of g.downstreams) for (const e of validateDs(g, d)) p.push({ where: `${g.name} › ${d.name}`, msg: e });
  return p;
}

function tree() {
  const s = S.sel;
  const node = (label, lead, d, sel, right = '') =>
    `<div class="node ${same(s, sel) ? 'on' : ''}" style="--d:${d}" data-sel='${JSON.stringify(sel)}'>${lead}${label}<span class="r">${right}</span></div>`;
  let h = `<div class="sec"><span>网关</span><span class="faint">＋</span></div>`;
  CFG.gateways.forEach((g, gi) => {
    const open = S.expanded.has(gi);
    h += node(`<b style="font-weight:600">${g.name}</b>`, `<span class="tw" data-fold="${gi}">${open ? '▼' : '▶'}</span>`, 0, { kind: 'gw', gw: gi }, `<span class="faint mono" data-grps="${g.name}"></span>`);
    if (!open) return;
    g.upstreams.forEach((u, ui) => h += node(`<span class="muted">↓</span> ${u.type} <span class="faint mono">${u.addr.split(':')[1]}</span>`, '<span class="tw"></span>', 1, { kind: 'up', gw: gi, up: ui }));
    g.downstreams.forEach((d, di) => {
      const bad = validateDs(g, d).length;
      h += node(`<span class="muted">→</span> ${d.name}`, '<span class="tw"></span>', 1, { kind: 'ds', gw: gi, ds: di },
        bad ? '<span class="err-txt">●</span>' : dirty.has(`${g.name}/${d.name}`) ? '<span style="color:var(--warn)">M</span>' : `<span class="faint mono">${d.slave_ids}</span>`);
    });
  });
  h += `<div class="sec" style="margin-top:6px"><span>模拟从站</span><span class="faint">＋</span></div>`;
  CFG.simulations.forEach((sm, si) => h += node(sm.name, `<span class="dot ${SIM_STATE[sm.name].status === 'ready' ? '' : 'warn'}"></span>`, 0, { kind: 'sim', sim: si }, `<span class="faint">${sm.persistence.type}</span>`));
  h += `<div class="sec" style="margin-top:6px"><span>系统</span></div>` + node('日志与诊断', '<span class="tw"></span>', 0, { kind: 'sys' });
  return h;
}
/* if the tree doesn't fit, collapse gateways that don't hold the selection — never scroll */
function autoFoldTree() {
  const side = $('#side'); if (!side) return;
  let folded = 0;
  while (side.scrollHeight > side.clientHeight + 1) {
    const victim = [...S.expanded].reverse().find(i => i !== S.sel.gw);
    if (victim === undefined) break;
    S.expanded.delete(victim); folded++;
    side.innerHTML = tree();
  }
  if (folded) side.insertAdjacentHTML('beforeend', `<div class="fold">已自动折叠 ${folded} 个网关以适应窗口高度</div>`);
}

/* ===================== topology (folded in from variant B) ===================== */
function topology() {
  const el = $('#topo'); if (!el) return;
  const gw = selGw(), gi = CFG.gateways.indexOf(gw), W = el.clientWidth, H = el.clientHeight;
  const sims = [...new Set(gw.downstreams.map(d => d.sim).filter(Boolean))];
  const nw = Math.max(R(118), Math.min(R(180), W / (sims.length ? 5.2 : 4.2)));
  el.style.setProperty('--nw', nw + 'px');
  const cx = (sims.length ? [.13, .37, .63, .87] : [.17, .5, .83]).map(c => W * c);
  const ys = (n, i) => { const step = Math.min((H - 40) / (n + 1), 130); return H / 2 + 8 + (i - (n - 1) / 2) * step; };
  const N = [];
  gw.upstreams.forEach((u, i) => N.push({ id: 'up' + i, sel: { kind: 'up', gw: gi, up: i }, x: cx[0], y: ys(gw.upstreams.length, i), k: '上游 · ' + u.type, n: u.addr, s: `${2 + i} 个连接` }));
  N.push({ id: 'gw', gw: 1, live: gw.name, sel: { kind: 'gw', gw: gi }, x: cx[1], y: ys(1, 0), k: '网关', n: gw.name, s: '' });
  gw.downstreams.forEach((d, i) => N.push({ id: 'ds' + i, live: gw.name + '/' + d.name, sel: { kind: 'ds', gw: gi, ds: i }, x: cx[2], y: ys(gw.downstreams.length, i), k: d.type + ' · ID ' + d.slave_ids, n: d.name, s: '', bad: validateDs(gw, d).length }));
  sims.forEach((sn, i) => N.push({ id: 'sim:' + sn, sel: { kind: 'sim', sim: CFG.simulations.findIndex(x => x.name === sn) }, x: cx[3], y: ys(sims.length, i), k: '模拟从站', n: sn, s: SIM_STATE[sn].status, st: SIM_STATE[sn].status }));
  const P = Object.fromEntries(N.map(n => [n.id, n]));
  const E = [];
  gw.upstreams.forEach((_, i) => E.push(['up' + i, 'gw', gw.name]));
  gw.downstreams.forEach((d, i) => { E.push(['gw', 'ds' + i, gw.name + '/' + d.name]); if (d.sim) E.push(['ds' + i, 'sim:' + d.sim, gw.name + '/' + d.name, d.type === 'injector']); });
  const onId = N.find(n => same(n.sel, S.sel))?.id, half = nw / 2;
  const curve = (a, b) => { const mx = (a.x + b.x) / 2; return `M${a.x + half},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x - half},${b.y}`; };
  el.innerHTML = `<svg><style>@keyframes flow{to{stroke-dashoffset:-20}}.fl{animation:flow 1s linear infinite}</style>
    ${E.map(([a, b, key, inj]) => { const hi = onId && (a === onId || b === onId); return `
      <path d="${curve(P[a], P[b])}" fill="none" stroke="${hi ? '#a1a1aa' : '#d4d4d8'}" stroke-width="${hi ? 3 : 2}"/>
      <path d="${curve(P[a], P[b])}" fill="none" stroke="${inj ? '#3b82f6' : '#111'}" stroke-width="1.5" stroke-dasharray="4 6" class="fl" data-edge="${key}" style="opacity:${onId && !hi ? .3 : .85}"/>
      <text x="${(P[a].x + P[b].x) / 2}" y="${(P[a].y + P[b].y) / 2 - 6}" text-anchor="middle" style="font-size:calc(10.5px * var(--k))" fill="#6b7280" font-family="ui-monospace,Menlo" ${inj ? '' : `data-elabel="${key}"`}>${inj ? '写入映射' : ''}</text>`; }).join('')}</svg>
    ${(sims.length ? ['上游', '网关', '下游', '模拟从站'] : ['上游', '网关', '下游']).map((l, i) => `<div class="tcol" style="left:${cx[i]}px">${l}</div>`).join('')}
    ${N.map(n => `<div class="tn ${n.gw ? 'gw' : ''} ${n.id === onId ? 'on' : ''}" data-sel='${JSON.stringify(n.sel)}' style="left:${n.x}px;top:${n.y}px">
      <div class="k"><span>${n.k}</span>${n.bad ? '<span class="err-txt">● 冲突</span>' : n.st ? `<span class="dot ${n.st === 'ready' ? '' : 'warn'}"></span>` : ''}</div>
      <div class="n">${n.n}</div><div class="s" ${n.live ? `data-nsub="${n.live}"` : ''}>${n.s}</div></div>`).join('')}
    <div class="tlegend"><span><i></i>转发流量（流速 ∝ req/s）</span>${sims.length ? '<span><i class="inj"></i>注入写入</span>' : ''}</div>`;
  el.querySelectorAll('[data-sel]').forEach(n => n.onclick = () => select(JSON.parse(n.dataset.sel), true));
}

/* ===================== live refresh (no re-layout) ===================== */
function live() {
  const key = selKey(), x = m(key);
  const insp = $('#insp');
  if (insp) {
    insp.innerHTML = `<div style="font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">运行指标 <span class="muted" style="font-weight:400">· ${key === '*' ? '全部' : key}</span></div>
      <div class="kpi"><div><b>${x.rps}</b><span>请求/秒</span></div><div><b>${x.req ? (x.err / x.req * 100).toFixed(2) : '0.00'}%</b><span>错误率</span></div>
      <div><b>${fmtMs(pct(x.lat, .5))}</b><span>p50</span></div><div><b>${fmtMs(pct(x.lat, .99))}</b><span>p99</span></div></div>
      <div><div class="muted" style="font-size:calc(11px * var(--k));margin-bottom:4px">请求/秒 · 近 40 秒</div>${spark(x.hist, tall() ? 72 : 52)}</div>
      <div style="border-top:1px solid var(--hair);padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px">
        <span class="muted">累计请求</span><span class="mono">${x.req.toLocaleString()}</span><span class="muted">累计错误</span><span class="mono">${x.err}</span></div>
      ${tall() ? '<div class="grow"><div class="muted" style="font-size:calc(11px * var(--k));margin-bottom:6px">最近错误</div><div class="fill" id="errs"></div></div>' : ''}`;
    const errs = $('#errs');
    if (errs) {
      const list = LOG.filter(e => !e.ok && (key === '*' || (key.includes('/') ? e.gw + '/' + e.ds === key : e.gw === key))).slice(0, fit(errs, R(38)));
      errs.innerHTML = list.map(e => `<div style="height:calc(38px * var(--k));border-bottom:1px solid var(--hair-soft);overflow:hidden"><div class="err-txt" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.err}</div><div class="muted mono" style="font-size:calc(10.5px * var(--k))">${hhmmss(e.t)} · ${e.ds} · slave ${e.slave}</div></div>`).join('') || '<div class="muted">无</div>';
    }
  }
  $$('[data-rps]').forEach(n => n.textContent = m(n.dataset.rps).rps);
  $$('[data-grps]').forEach(n => n.textContent = m(n.dataset.grps).rps + '/s');
  const tot = $('#tot'); if (tot) tot.textContent = `${m('*').rps} req/s · 错误 ${m('*').err}`;
  $$('[data-elabel]').forEach(t => t.textContent = m(t.dataset.elabel).rps + ' /s');
  $$('[data-edge]').forEach(p => { const r = m(p.dataset.edge).rps; p.style.animationDuration = r ? Math.max(.25, 3 / r) + 's' : '0s'; });
  $$('[data-nsub]').forEach(n => { const y = m(n.dataset.nsub); n.textContent = `${y.rps} req/s · p99 ${fmtMs(pct(y.lat, .99))}`; });
  if (S.sel.kind === 'sim') {
    const sm = CFG.simulations[S.sel.sim];
    S.simPage = regGrid($('#grid'), sm.name, S.simTable, S.simStart) || S.simPage;
    const r = $('#range'); if (r) r.textContent = `${hex(S.simStart)}–${hex(Math.min(65535, S.simStart + S.simPage - 1))}`;
    const v = $('#ver'); if (v) v.textContent = `v${SIM_STATE[sm.name].version}`;
  }
  const dock = $('#dock'); if (!dock) return;
  if (S.dock === 'log') logRows(dock, S.sel.kind === 'sim' || S.sel.kind === 'sys' ? null : (e => key.includes('/') ? e.gw + '/' + e.ds === key : e.gw === key));
  else if (S.dock === 'prob') { const p = allProblems(); dock.innerHTML = p.length ? `<table class="t">${p.map(x => `<tr><td style="width:24px" class="err-txt">✕</td><td style="width:220px">${x.where}</td><td>${x.msg}</td></tr>`).join('')}</table>` : '<div class="muted" style="padding:12px">没有发现问题</div>'; }
  else dock.innerHTML = `<div class="mono" style="padding:8px 12px;line-height:1.7;color:var(--muted)">level=INFO msg="Gateway started" name=modbus-slave<br>level=INFO msg="Upstream listening" addr=0.0.0.0:33502<br>level=WARN msg="simulation degraded" name=boiler err="persistence write failed"</div>`;
}

/* ===================== interactions ===================== */
function select(sel, fromTopo) {
  S.sel = sel; S.simStart = 0;
  if (sel.gw !== undefined) S.expanded.add(sel.gw);
  if (!split() && !fromTopo) S.tab = 'detail';
  render();
}
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;top:78px;right:16px;z-index:998;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-width:380px;border:1px solid var(--hair);background:${kind === 'err' ? 'var(--err-bg)' : kind === 'warn' ? 'var(--warn-bg)' : '#fff'};color:${kind === 'err' ? 'var(--err)' : kind === 'warn' ? 'var(--warn)' : 'var(--ink)'}`;
  t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function act(a) {
  const p = allProblems();
  if (a === 'validate') toast(p.length ? '✕ 校验失败：' + p.map(x => x.msg).join('；') : '✓ 校验通过（模拟 POST /api/v1/config/validate）', p.length ? 'err' : '');
  if (a === 'save') { if (p.length) return toast(`✕ 存在 ${p.length} 个问题，未写入 config.yaml`, 'err'); toast('已写入 config.yaml（原型不落盘）。<b>需重启网关进程才会生效。</b>', 'warn'); dirty.clear(); render(); }
  if (a === 'restart') toast('原型：将重启网关进程，期间 Modbus 连接会中断约 1 秒。', 'warn');
  if (a === 'pause') { paused = !paused; render(); }
}
let formT;
function bind() {
  $$('.side [data-sel]').forEach(n => n.onclick = e => { if (e.target.dataset.fold) return; select(JSON.parse(n.dataset.sel)); });
  $$('[data-fold]').forEach(n => n.onclick = () => { const i = +n.dataset.fold; S.expanded.has(i) ? S.expanded.delete(i) : S.expanded.add(i); render(); });
  $$('[data-tab]').forEach(n => n.onclick = () => { S.tab = n.dataset.tab; render(); });
  $$('[data-dock]').forEach(n => n.onclick = () => { S.dock = n.dataset.dock; render(); });
  $$('[data-act]').forEach(n => n.onclick = () => act(n.dataset.act));
  $$('[data-tbl]').forEach(n => n.onclick = () => { S.simTable = n.dataset.tbl; render(); });
  const jump = $('#jump');
  if (jump) jump.onchange = () => { S.simStart = Math.min(65535, Math.max(0, parseInt(jump.value, 16) || 0)); live(); };
  $$('[data-step]').forEach(n => n.onclick = () => { S.simStart = Math.min(65535, Math.max(0, S.simStart + Number(n.dataset.step) * S.simPage)); jump.value = hex(S.simStart); live(); });
  if (S.sel.kind === 'ds') {
    const gw = CFG.gateways[S.sel.gw], d = gw.downstreams[S.sel.ds];
    $$('[data-form] [data-k]').forEach(inp => inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', () => {
      d[inp.dataset.k] = inp.value; dirty.add(`${gw.name}/${d.name}`);
      clearTimeout(formT); formT = setTimeout(() => keepFocus(render), inp.tagName === 'SELECT' ? 0 : 400);
    }));
  }
  $$('[data-split]').forEach(h => {
    h.ondblclick = () => { S.sideW = S.dockH = S.dockW = null; render(); };
    h.onmousedown = e => {
      e.preventDefault(); h.classList.add('drag');
      const kind = h.dataset.split, main = $('.main').getBoundingClientRect();
      const mv = ev => {
        if (kind === 'side') S.sideW = Math.round(Math.min(360, Math.max(180, ev.clientX - main.left)));
        if (kind === 'dockh') S.dockH = Math.round(Math.min(main.height * .6, Math.max(140, main.bottom - ev.clientY)));
        if (kind === 'dockw') S.dockW = Math.round(Math.min(innerWidth * .35, Math.max(380, main.right - ev.clientX)));
        applyLayout();
      };
      const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); render(); };
      addEventListener('mousemove', mv); addEventListener('mouseup', up);
    };
  });
}
function keepFocus(fn) {
  const a = document.activeElement, k = a?.dataset?.k, pos = a?.selectionStart;
  fn();
  if (k) { const n = $(`[data-form] [data-k="${k}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }
}
addEventListener('keydown', e => {
  if (e.target.matches?.('input,textarea,select')) return;
  if (e.key === ' ') { e.preventDefault(); act('pause'); }
  if ((e.metaKey || e.ctrlKey) && (e.key === '1' || e.key === '2')) { e.preventDefault(); S.tab = e.key === '1' ? 'detail' : 'topo'; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); act('save'); }
});
let rt;
addEventListener('resize', () => {
  $('#tiny-now').textContent = `当前 ${innerWidth} × ${innerHeight}`;
  clearTimeout(rt); rt = setTimeout(render, 100);
});
$('#tiny-now').textContent = `当前 ${innerWidth} × ${innerHeight}`;
for (let i = 0; i < 60; i++) tick();
booted = true;
render();
setInterval(tick, 1000);
</script>
</body>
